<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Override | Submit Cartridge</title>
    <link rel="stylesheet" href="src/css/style.css">
    <!-- Auth Guard loaded once here -->
    <script type="module" src="src/js/guard.js"></script>
</head>
<body>

    <header>
        <div class="nav-content container">
            <a href="/" class="logo"><span class="logo-icon">>_</span> Override</a>
            <div class="nav-links">
                <a href="/hub" id="navHub">Hub</a>
                <a href="/docs" id="navDocs">Docs</a>
                <a href="/submit" id="navSubmit" class="text-accent">Submit</a>
                <!-- Dynamic Auth Button Required for main.js -->
                <a href="/auth" id="authNavBtn" style="font-weight: 600;">Sign In</a>
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle Theme">
                    <svg id="sunIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" style="display: none;"><path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.166a.75.75 0 00-1.06-1.06l-1.591 1.59a.75.75 0 101.06 1.061l1.591-1.59zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5H21a.75.75 0 01.75.75zM17.834 18.894a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 10-1.061 1.06l1.59 1.591zM12 18a.75.75 0 01.75.75V21a.75.75 0 01-1.5 0v-2.25A.75.75 0 0112 18zM7.758 17.303a.75.75 0 00-1.061-1.06l-1.591 1.59a.75.75 0 001.06 1.061l1.591-1.59zM6 12a.75.75 0 01-.75.75H3a.75.75 0 010-1.5h2.25A.75.75 0 016 12zM6.697 7.757a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 00-1.061 1.06l1.59 1.591z" /></svg>
                    <svg id="moonIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M9.528 1.718a.75.75 0 01.162.819A8.97 8.97 0 009 6a9 9 0 009 9 8.97 8.97 0 003.463-.69.75.75 0 01.981.98 10.503 10.503 0 01-9.694 6.46c-5.799 0-10.5-4.701-10.5-10.5 0-4.368 2.667-8.112 6.46-9.694a.75.75 0 01.818.162z" clip-rule="evenodd" /></svg>
                </button>
            </div>
        </div>
    </header>

    <main class="container submit-container">
        <h1>Deploy Cartridge</h1>
        <!-- Updated subtitle to remove XML requirement -->
        <p class="text-muted">Inject a new override payload into the system. Plain text, markdown, and XML are supported.</p>

        <form id="submitForm" class="auth-form" style="margin-top: 2rem;">
            <div class="input-group">
                <label for="title">Cartridge Name</label>
                <input type="text" id="title" placeholder="e.g., Ubuntu 22.04 LTS Terminal" required>
            </div>

            <div class="input-group">
                <label for="description">System Description</label>
                <input type="text" id="description" placeholder="Briefly describe what this override accomplishes." required>
            </div>

            <div class="input-group">
                <label for="tags">Tags (Comma Separated)</label>
                <input type="text" id="tags" placeholder="terminal, linux, utility" required>
            </div>

            <div class="input-group">
                <label for="xmlContent">Cartridge Payload (Text or XML)</label>
                <textarea id="xmlContent" class="code-input" placeholder="Enter your full prompt payload here. You can use plain text, markdown, or XML tags to structure the override..." required></textarea>
            </div>

            <button type="submit" class="btn btn-primary" id="submitBtn">Deploy Cartridge</button>
        </form>
    </main>

    <script type="module" src="src/js/main.js"></script>
    <script type="module" src="src/js/submit.js"></script>
</body>
</html>
