<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Override | The Hub</title>
    <link rel="stylesheet" href="src/css/style.css">

            </div>
        </div>

    <main class="container hub-container">
        <div class="hub-header">
            <div>
                <h1>The Hub</h1>
                <p class="text-muted">Discover and deploy community context cartridges.</p>
            </div>
            <a href="/submit" class="btn btn-primary">Create Cartridge</a>
        </div>

        <div id="hubGrid" class="hub-grid">
            <!-- Loading State -->
            <p class="text-muted" id="hubLoading">Connecting to database...</p>
        </div>
    </main>

    <script type="module" src="src/js/main.js"></script>
    <script type="module" src="src/js/hub.js"></script>

</html>
